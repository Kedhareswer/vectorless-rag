[package]
name = "vectorless-rag"
version = "0.1.0"
description = "TGG — Tree-Grounded Generation"
authors = ["you"]
edition = "2024"
rust-version = "1.95"  # oar-ocr (OCR backend) needs 1.95

[lib]
name = "vectorless_rag_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-opener = "2.7"
tauri-plugin-dialog = "2.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.40", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.35"
thiserror = "2"
reqwest = { version = "0.13", features = ["json", "stream", "blocking"] }
async-trait = "0.1"
pulldown-cmark = "0.13"
pdf-extract = "0.12"
calamine = "0.36"
csv = "1"
zip = "9"
flate2 = "1"
tar = "0.4"
quick-xml = "0.42"
keyring = { version = "3", features = ["sync-secret-service", "windows-native", "apple-native"] }
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
lopdf = "0.45"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
candle-core = "0.11"
candle-transformers = "0.11"
candle-nn = "0.11"
tokenizers = "0.23"
# Layout-aware PDF parsing. Tesseract stays off (needs a native toolchain); the
# ONNX backend reads scanned PDFs, downloading its models on first use.
# shortcut: liteparse's oar-ocr 0.8 asks for ort "2.0.0-rc.12" but every 2.0.0
# pre-release satisfies that, and rc.13 dropped `CPUExecutionProvider`, so
# Cargo.lock pins ort to rc.12. Drop the pin once oar-ocr builds on a later rc.
liteparse = { version = "2.15", default-features = false, features = ["oar-ocr-auto-download"] }
# PDFium loader used by liteparse. Depended on directly so build.rs receives
# DEP_PDFIUM_LIB_PATH and can bundle the shared library with the app.
pdfium-sys = { package = "liteparse-pdfium-sys", version = "1.11" }
# ONNX Runtime, pulled in by the OCR backend. Declared here only to turn on
# `load-dynamic`. Static linking is not an option on Windows: pyke's prebuilt
# onnxruntime.lib is built against the static MSVC CRT, while PDFium and std
# use the dynamic one, and linking both fails (LNK2005, and LNK1319 once the
# static CRT is excluded). Loading a DLL at runtime keeps one CRT in the link.
# The DLL is not shipped by ort — see `ocr_engine` in document/liteparse.rs.
ort = { version = "2.0.0-rc.12", features = ["load-dynamic"] }

[dev-dependencies]
tempfile = "3"
